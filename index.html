<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/jpeg" href="images/premiere_photo.webp" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A💛A</title>
    <link rel="stylesheet" href="struct/style.css">
</head>
<body class="page-login">

    <div class="card">
        <h1>Zone Protégée 🔒❤️</h1>
        <p>Seulement 1 personne peut accéder à ce site</p>
        <p class="question"><strong>Un mot pour décrire notre relation ;)</strong></p>
        
        <form id="auth-form">
            <div class="input-container">
                <input type="password" id="answer-input" placeholder=" " required autocomplete="off">
                <label for="answer-input">Mot de passe</label>
                
                <button type="button" id="togglePassword" class="password-toggle-btn" aria-label="Afficher le mot de passe">
                    <svg id="eye-icon" viewBox="0 0 24 24" fill="currentColor" width="20px" height="20px" aria-hidden="true">
                        <path id="eye-path" fill-rule="evenodd" clip-rule="evenodd" d="M20.293 2.293a1 1 0 1 1 1.414 1.414l-18 18a1 1 0 0 1-1.414-1.414l3.446-3.446c-.238-.188-.47-.387-.694-.6L1.31 12.722a.985.985 0 0 1 0-1.436l3.734-3.527c3.15-2.976 7.77-3.542 11.48-1.697l3.768-3.768zm-5.275 5.275c-2.852-1.138-6.23-.596-8.582 1.627l-2.974 2.808 2.974 2.809c.233.22.476.423.727.61l1.391-1.39a4 4 0 0 1 5.478-5.478l.986-.986zm-2.5 2.5a2.001 2.001 0 0 0-2.45 2.45l2.45-2.45z"></path>
                        <path d="M22.69 11.285 19.7 8.463l-1.414 1.414 2.251 2.126-2.973 2.809a8.099 8.099 0 0 1-6.377 2.164l-1.712 1.712c3.268.833 6.876.02 9.48-2.44l3.733-3.527a.985.985 0 0 0 0-1.436z"></path>
                        <path d="M15.997 12.167a4 4 0 0 1-3.83 3.83l3.83-3.83z"></path>
                    </svg>
                </button>
            </div>
            <button type="submit" style="margin-top: 10px;">Entrer</button>
        </form>
        <div id="error-msg" class="error hidden">Mauvaise réponse 💔</div>
    </div>

    <script src="JS/script.js"></script>
</body>
</html>
