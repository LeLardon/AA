<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/jpeg" href="images/premiere_photo.jpg" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A💛A</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-login">

    <div class="card">
        <h1>Zone Protégée 🔒❤️</h1>
        <p>Seulement 1 personne peut accéder à ce site</p>
        <p class="question"><strong>Un mot pour décrire notre relation ;)</strong></p>
        
        <form id="auth-form">
            <input type="text" id="answer-input" placeholder="Votre réponse..." required autocomplete="off">
            <button type="submit">Entrer</button>
        </form>
        <p id="error-msg" class="error hidden">Mauvaise réponse, réessayez !</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
